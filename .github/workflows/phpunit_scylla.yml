name: PHPunit Cassandra (ScyllaDB)

on:
  push:
    branches:
      - master
  pull_request: null

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]

    name: PHPunit Cassandra - PHP ${{ matrix.php }}

    services:
      scylla:
        image: scylladb/scylla:5.4
        ports:
          - 9042:9042
        options: >-
          --health-cmd="cqlsh -e 'describe cluster'"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: cassandra

      - name: Composer update
        run: composer update --no-progress --no-interaction

      - name: PHPunit
        run: vendor/bin/phpunit --no-coverage --filter Cassandra
        env:
          PHOENIX_CASSANDRA_HOST: 127.0.0.1
          PHOENIX_CASSANDRA_PORT: 9042
          PHOENIX_CASSANDRA_KEYSPACE: phoenix
